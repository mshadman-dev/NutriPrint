<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1D9E75"/>
  <link rel="icon" type="image/jpeg" href="/static/images/logo.jpg"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet"/>
  <title>Page Not Found — NutriPrint</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, sans-serif;
      background: #FFFFFF;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .icon {
      width: 6rem;
      height: 6rem;
      border-radius: 50%;
      background: rgba(29, 158, 117, 0.1);
      border: 1px solid rgba(29, 158, 117, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1.5rem;
    }
    .code {
      font-family: Poppins, sans-serif;
      font-weight: 900;
      font-size: 4.5rem;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #3EFFA8, #1D9E75);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    .title {
      font-family: Poppins, sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      color: #0F172A;
      margin-bottom: 0.75rem;
    }
    .body {
      font-size: 0.92rem;
      color: #94A3B8;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 150ms ease;
      cursor: pointer;
      border: none;
    }
    .btn-primary {
      background: #1D9E75;
      color: white;
      box-shadow: 0 0 20px rgba(29,158,117,0.3);
    }
    .btn-primary:hover { background: #18876A; transform: translateY(-1px); }
    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: #0F172A;
    }
    .btn-ghost:hover { border-color: #1D9E75; color: #3EFFA8; }
    .footer {
      margin-top: 3rem;
      font-size: 0.72rem;
      color: #4A5568;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔍</div>
    <div class="code">404</div>
    <h1 class="title">Page Not Found</h1>
    <p class="body">
      The page you're looking for doesn't exist or has been moved.
      Let's get you back on track.
    </p>
    <div class="actions">
      <a href="/" class="btn btn-primary">🏠 Go Home</a>
      <a href="/dashboard" class="btn btn-ghost">📊 Dashboard</a>
      <a href="/bmi" class="btn btn-ghost">📐 BMI Assessment</a>
    </div>
    <p class="footer">NutriPrint · AI-Powered School Nutrition Platform</p>
  </div>
</body>
</html>
